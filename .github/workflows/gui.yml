name: Desktop GUI

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - cmd/gui.go
      - go.mod
      - go.sum
      - .github/workflows/gui.yml
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            tags: gui desktop production webkit2_41
            ldflags: ""
            binary: goqlprinter-gui
          - name: macos
            os: macos-latest
            tags: gui desktop production
            ldflags: ""
            binary: goqlprinter-gui
          - name: windows
            os: windows-latest
            tags: gui desktop production
            # GUI subsystem: no console window (CLI output is not available in this binary)
            ldflags: -H windowsgui
            binary: goqlprinter-gui.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build GUI
        shell: bash
        env:
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
        run: |
          go build -tags "${{ matrix.tags }}" \
            -ldflags "-X main.version=${GITHUB_REF_NAME} ${{ matrix.ldflags }}" \
            -o "${{ matrix.binary }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: goqlprinter-gui-${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
